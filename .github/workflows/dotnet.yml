name: DeRelay CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore DeRelay.slnx

      - run: dotnet build DeRelay.slnx --no-restore --nologo -v q

      - run: dotnet test tests/DeRelay.Tests/DeRelay.Tests.csproj --no-build --nologo -v q
